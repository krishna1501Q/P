<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple Game</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        background: black;
        color: white;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    #score {
        position: fixed;
        top: 20px;
        left: 20px;
        font-size: 24px;
    }

    #box {
        width: 80px;
        height: 80px;
        background: white;
        position: absolute;
        cursor: pointer;
    }
</style>
</head>
<body>

<div id="score">Score: 0</div>
<div id="box"></div>

<script>
    let score = 0;
    const box = document.getElementById("box");

    function moveBox() {
        const maxX = window.innerWidth - 80;
        const maxY = window.innerHeight - 80;

        const x = Math.random() * maxX;
        const y = Math.random() * maxY;

        box.style.left = x + "px";
        box.style.top = y + "px";
    }

    box.addEventListener("click", () => {
        score++;
        document.getElementById("score").innerText = "Score: " + score;
        moveBox();
    });

    moveBox();
</script>

</body>
</html>
