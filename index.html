<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Welcome</title>

<style>
    body {
        margin: 0;
        background: black;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    #container {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    img {
        max-width: 90%;
        max-height: 70vh;
        object-fit: contain;
        margin-bottom: 20px;
    }

    button {
        padding: 15px 30px;
        font-size: 18px;
        font-weight: bold;
        border: none;
        border-radius: 30px;
        background: orange;
        color: white;
        cursor: pointer;
    }

    .heart {
        position: fixed;
        font-size: 24px;
        animation: float 3s linear forwards;
    }

    @keyframes float {
        0% {
            transform: translateY(0);
            opacity: 1;
        }
        100% {
            transform: translateY(-200px);
            opacity: 0;
        }
    }
</style>
</head>
<body>

<div id="container">
    <img src="image.jpg" alt="Main Image">

    <button onclick="createHearts()">
        IF YOU ARE BJP LOVER ❤️
    </button>
</div>

<audio id="audio">
    <source src="audio.mp3" type="audio/mpeg">
</audio>

<script>
    // play audio after first tap (mobile rule)
    document.body.addEventListener("click", () => {
        document.getElementById("audio").play();
    }, { once: true });

    function createHearts() {
        for (let i = 0; i < 20; i++) {
            const heart = document.createElement("div");
            heart.className = "heart";
            heart.innerHTML = "❤️";

            heart.style.left = Math.random() * window.innerWidth + "px";
            heart.style.bottom = "0px";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 3000);
        }
    }
</script>

</body>
</html>
